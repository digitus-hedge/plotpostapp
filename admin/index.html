<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PlotPost Admin Panel</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
<script src="app.js" defer></script>
</head>
<body>

<!-- Sign in -->
<div class="login" id="login-view" hidden>
  <form class="login-card" id="login-form" novalidate>
    <div class="brand">
      <img class="mark" src="icon.png" alt="" width="40" height="40">
      <div><div class="word">plotpost<span>.</span></div><div class="tag">Admin panel</div></div>
    </div>
    <div>
      <h1>Sign in</h1>
      <p class="help">Use your PlotPost email and password. Only admin accounts can open this panel.</p>
    </div>
    <label class="lb" for="login-email">Email</label>
    <input class="input" id="login-email" type="email" autocomplete="username" required>
    <label class="lb" for="login-password">Password</label>
    <input class="input" id="login-password" type="password" autocomplete="current-password" required>
    <p class="err" id="login-error" role="alert"></p>
    <button type="submit" class="btn primary big" id="login-button">Sign in</button>
  </form>
</div>

<!-- Panel -->
<div class="app" id="app-view" hidden>
  <aside class="side" aria-label="Admin navigation">
    <div class="brand">
      <img class="mark" src="icon.png" alt="" width="40" height="40">
      <div><div class="word">plotpost<span>.</span></div><div class="tag">Admin panel</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <p class="mock">Act on every report within 24 hours. Support: WhatsApp +91 62356 49489.</p>
      <button type="button" class="btn sm self-start" data-act="signout">Sign out</button>
    </div>
  </aside>
  <div class="stage">
    <header class="topbar">
      <label class="search"><span class="sr">Search listings, sellers and IDs</span>
        <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="5.5"/><path d="m13 13 4 4"/></svg>
        <input id="gsearch" type="search" placeholder="Search listings, sellers, IDs" autocomplete="off">
      </label>
      <div class="top-end">
        <button type="button" class="roundbtn" data-act="theme" aria-label="Switch between light and dark">
          <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 11.5A6.5 6.5 0 0 1 8.5 3.5a6.5 6.5 0 1 0 8 8z"/></svg>
        </button>
        <span class="pillbtn" id="me-pill"><span class="avatar" id="me-initials" aria-hidden="true"></span><span id="me-name"></span></span>
        <button type="button" class="roundbtn mobile-only" data-act="signout" aria-label="Sign out">
          <svg class="ico" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3.5H4v13h4M12.5 6.5 16 10l-3.5 3.5M16 10H7.5"/></svg>
        </button>
      </div>
    </header>
    <div class="panel" id="main">
      <div class="phead" id="phead">
        <div class="ph-logo" aria-hidden="true"><img class="mark" src="icon.png" alt="" width="30" height="30"><span class="word">plotpost<span>.</span></span></div>
        <div class="ph-txt"><h1 id="vt">Dashboard</h1><div class="sub" id="vs"></div></div>
        <div class="look" role="group" aria-label="Banner colour">
          <button type="button" data-act="look" data-look="light" aria-pressed="true">Light</button>
          <button type="button" data-act="look" data-look="vibrant" aria-pressed="false">Vibrant</button>
        </div>
      </div>
      <main class="content" id="content"></main>
    </div>
  </div>
</div>

<div class="scrim" id="scrim" data-act="closeDrawer"></div>
<aside class="drawer" id="drawer" aria-label="Details" aria-hidden="true"></aside>
<div class="modal" id="modal"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
